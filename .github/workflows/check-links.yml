# The monthly run every site calls from its own .github/workflows/links.yml:
# builds the site and requests every external link in the output. A link that
# has died fails the run, and a failed scheduled run is the alert (GitHub
# emails the repository owner), so a page of outbound links never needs
# anyone to remember it.
#
# Dead, three tries in a row: 404, 410, a server error or a hostname that no
# longer resolves. A 401, 403, 406, 429 or 999 is a site
# refusing a bot, which proves the page exists. A timeout, a refused
# connection or a certificate the runner cannot validate (an incomplete chain
# that browsers repair on their own) is only a warning: Brazilian public bodies drop
# connections from GitHub's foreign addresses while answering at home, and an
# alert that cries wolf every month gets ignored.
name: check-links
on:
  workflow_call:
    inputs:
      site:
        description: Folder holding site.toml, relative to the repository root
        type: string
        default: "."
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.site }}
    steps:
      - uses: actions/checkout@v7

      - name: Install MageHat
        run: |
          curl -fsSL https://github.com/robo-kick/mage-hat/releases/latest/download/magehat-linux-x64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/magehat-linux-x64" >> "$GITHUB_PATH"

      - name: Build
        run: magehat build

      - name: Request every external link
        run: |
          own=$(sed -n 's/^url *= *"\([^"]*\)".*/\1/p' site.toml | head -n 1)
          grep -rhoE 'href="https?://[^"]+"' dist --include=*.html | sed 's/^href="//; s/"$//; s/&amp;/\&/g' | grep -v -F "$own" | sort -u > "$RUNNER_TEMP/links.txt"
          check_one() {
            url=$1; code=000; rc=0
            for try in 1 2 3; do
              code=$(curl -sS -L -o /dev/null -m 20 -w '%{http_code}' -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' "$url" 2> /dev/null); rc=$?
              case "$code" in 2??|3??|401|403|406|429|999) return 0 ;; esac
              sleep 2
            done
            if [ "$code" != 000 ]; then echo "DEAD $code $url"
            else
              case "$rc" in
                6) echo "DEAD curl-6 $url" ;;
                *) echo "UNREACHABLE curl-$rc $url" ;;
              esac
            fi
          }
          export -f check_one
          xargs -a "$RUNNER_TEMP/links.txt" -P 8 -I{} bash -c 'check_one "{}"' > "$RUNNER_TEMP/results.txt"
          total=$(wc -l < "$RUNNER_TEMP/links.txt")
          dead=$(grep -c '^DEAD' "$RUNNER_TEMP/results.txt" || true)
          grep '^UNREACHABLE' "$RUNNER_TEMP/results.txt" | sed 's/^UNREACHABLE /::warning::unreachable from here: /' || true
          grep '^DEAD' "$RUNNER_TEMP/results.txt" | sed 's/^DEAD /::error::/' || true
          echo "$total external links, $dead dead"
          [ "$dead" = 0 ]
